command-index = "指令索引"
new = "新增"
updated = "更新"
note-sep = "："
example = "例 {}"
figure = "圖"
table = "表"
section-number = "第 {} 節"
section-ref = "第 {} 節"
appendix-number = "附錄 {}"
appendix-ref = "附錄 {}"
theorem = "定理"
theorem-ref = "定理 {}"
proof = "證明"
proof-of = "{}的證明"
figure-ref = "圖 {}"
table-ref = "表 {}"
example-ref = "例 {}"
default = "預設"
header-upper = false
version-date = "{date} · v{version}"
changelog-general = "一般"

