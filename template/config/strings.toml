# Interface strings shared by every manual, per language edition.
# "{}" is replaced by a number. Keys missing from a language fall back to [en].
# A manual's own title and placeholder names live in its manual.toml.

[en]
references = "References"
lang = "en"
region = ""
script = "latin"
contents = "Contents"
command-index = "Command Index"
new = "New"
updated = "Updated"
email = "Email: {}"                                                       # author footnote on the title page
corresponding = "Corresponding author. "
note-sep = ": "                                                             # between “New”/“Updated” and the version
example = "Example {}"
figure = "Figure"
table = "Table"
section-number = "{}"                                                       # how a section number is shown in its heading
section-ref = "Section {}"                                                  # how a section is referred to in running text
appendix-number = "Appendix {}"                                             # an appendix heading and its running header
appendix-ref = "Appendix {}"
theorem = "Theorem"
theorem-ref = "Theorem {}"
proof = "Proof"
proof-of = "Proof of {}"
figure-ref = "Figure {}"
table-ref = "Table {}"
example-ref = "Example {}"
default = "default"
header-upper = true                                                         # running header in upper case (LaTeX headings style)
version-date = "{date} · v{version}"

changelog-general = "General"

[zh-TW]
