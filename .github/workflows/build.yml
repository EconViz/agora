name: Build manuals

# Checks that every edition of every manual compiles. The published PDFs are built locally
# with `make publish`, because Kaiti is not available here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The same TeX Live font packages a local TinyTeX build uses.
      - name: Install TinyTeX fonts
        run: |
          curl -fsSL https://yihui.org/tinytex/install-bin-unix.sh | sh
          echo "$(ls -d "$HOME"/.TinyTeX/bin/*)" >> "$GITHUB_PATH"
          "$HOME"/.TinyTeX/bin/*/tlmgr install tex-gyre tex-gyre-math cm-unicode newpx newcomputermodern

      - name: Install Typst
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1
          typst --version

      # Kaiti is missing by design; any other warning fails the build.
      - name: Build PDFs
        shell: bash
        run: |
          make all 2>&1 | tee build.log
          if grep "^warning:" build.log | grep -vE "unknown font family: kaiti (tc|sc)$"; then
            echo "::error::Typst reported warnings"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: manuals
          path: build/**/*.pdf
          if-no-files-found: error
          retention-days: 7
