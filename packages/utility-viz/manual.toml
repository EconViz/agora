# `make publish MANUAL=utility-viz` copies <name>-<edition>.pdf to
# econ-viz-docs/docs/assets/manual/. The name predates the rename and is kept
# so links on econ-viz.org stay valid.
[publish]
name = "econ-viz-manual"
