# Where scripts/make_figures.py writes the figures and which typeface sets them. The look of the
# drawings themselves comes from manual.toml, which the examples load.

[output]
dir = "figures"
format = "svg"   # vector; Typst embeds SVG directly

[fonts]
# manual*.toml name their font files; these places hold them besides agora/fonts (relative to TEXMFDIST).
texmf_dirs = ["fonts/opentype/public/tex-gyre", "fonts/opentype/public/tex-gyre-math"]
