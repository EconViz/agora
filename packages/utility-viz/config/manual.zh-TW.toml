# 圖形設定
# 白底黑軸灰曲線
# 畫圖前先載入
#
#     Config.load("manual.toml").use()
#
# 各區段對應 Theme 屬性

base = "default"

# 字體檔放在此檔旁
[font]
text = "serif"
math = "texgyrepagella-math.otf"

[fonts]
serif = ["NotoSerifTC-Regular.otf", "NotoSerifTC-Bold.otf"]

[color]
background = "#ffffff"
axis = "#1a1a1a"
label = "#1a1a1a"
ic = "#8c8c8c"              # 無異曲線
secondary_ic = "#b8b8b8"    # 強調曲線旁的曲線
path = "#1a1a1a"            # 價格與所得消費路徑
budget = "#222222"
eq = "#1a1a1a"              # 均衡點與其他點
ray = "#8c8c8c"
kink = "#8c8c8c"
sub_effect = "#8c8c8c"
inc_effect = "#8c8c8c"
compensated_budget = "#1a1a1a"
subsistence = "#8c8c8c"
contract = "#8c8c8c"
core = "#1a1a1a"
price = "#8c8c8c"
walrasian = "#1a1a1a"

[stroke.axis]
width = 1.0
style = "solid"
arrow = "-|>"

[stroke.ic]
width = 2.6

[stroke.secondary_ic]
width = 1.8
opacity = 1.0

[stroke.path]
width = 1.4

[stroke.budget]
width = 2.6

[stroke.ray]
width = 0.9

[stroke.substitution]
width = 1.8

[stroke.income]
width = 1.8

[stroke.compensated_budget]
width = 1.0

[stroke.contract]
width = 2.6

[stroke.price]
width = 2.6

[stroke.drop]               # 從點到座標軸的輔助線
width = 0.8
style = "dashed"
color = "#1a1a1a"

[stroke.projection]
width = 0.8
style = "dashed"
color = "#1a1a1a"

[stroke.guide]
width = 0.8
style = "dashed"
color = "#1a1a1a"

[marker.eq]
size = 5

[marker.point]
size = 5

[label.point]               # 點旁的文字如 x*
fontsize = 14
position = "right"
offset = 10

[fill.budget]
opacity = 0.08
