# 图形设置
# 灰色曲线 黑色轴 白底
# 画图前先加载
#
#     Config.load("manual.toml").use()
#
# 各区段对应 Theme 属性

base = "default"

# 字体是 TeX Gyre Pagella 但不指定
# 要用请加上 [font] text = "TeX Gyre Pagella"

[color]
background = "#ffffff"
axis = "#1a1a1a"
label = "#1a1a1a"
ic = "#8c8c8c"              # 无差异曲线
secondary_ic = "#b8b8b8"    # 强调曲线旁的曲线
path = "#1a1a1a"            # 价格与收入消费路径
budget = "#222222"
eq = "#1a1a1a"              # 均衡点与其他点
ray = "#8c8c8c"
kink = "#8c8c8c"
sub_effect = "#8c8c8c"
inc_effect = "#8c8c8c"
compensated_budget = "#1a1a1a"
subsistence = "#8c8c8c"
contract = "#8c8c8c"
core = "#1a1a1a"
price = "#8c8c8c"
walrasian = "#1a1a1a"

[stroke.axis]
width = 1.0
style = "solid"
arrow = "-|>"

[stroke.ic]
width = 2.6

[stroke.secondary_ic]
width = 1.8
opacity = 1.0

[stroke.path]
width = 1.4

[stroke.budget]
width = 2.6

[stroke.ray]
width = 0.9

[stroke.substitution]
width = 1.8

[stroke.income]
width = 1.8

[stroke.compensated_budget]
width = 1.0

[stroke.contract]
width = 2.6

[stroke.price]
width = 2.6

[stroke.drop]               # 从点到坐标轴的辅助线
width = 0.8
style = "dashed"
color = "#1a1a1a"

[stroke.projection]
width = 0.8
style = "dashed"
color = "#1a1a1a"

[stroke.guide]
width = 0.8
style = "dashed"
color = "#1a1a1a"

[marker.eq]
size = 5

[marker.point]
size = 5

[label.point]               # 点旁的文字 如 x*
fontsize = 14
position = "right"
offset = 10

[fill.budget]
opacity = 0.08
