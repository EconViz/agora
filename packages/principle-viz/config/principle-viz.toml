# Figure output and fonts for the manual. Read by scripts/make_figures.py.
# Colours, line widths and label placement are principle-viz's own: the "manual"
# palette (the EconViz greys), with built-in words translated through
# PlotTheme(language=...).

[output]
dir = "figures"
format = "svg"   # vector; Typst embeds SVG directly

[fonts]
# Text and math in the figures use TeX Gyre Pagella, the manual's body face; the Chinese
# editions set their text in Noto Serif (agora/fonts) and keep the math in Pagella Math.
math = "texgyrepagella-math.otf"
# A figure is drawn at 6 x 6 in and set at about half the text width, which
# shrinks its 10-11 pt labels; scale every text size by this factor (line
# widths are unchanged).
text_scale = 1.5
# Places the font files are found, besides agora/fonts (relative to TEXMFDIST).
texmf_dirs = ["fonts/opentype/public/tex-gyre", "fonts/opentype/public/tex-gyre-math"]

[fonts.text]
en = ["texgyrepagella-regular.otf", "texgyrepagella-italic.otf", "texgyrepagella-bold.otf", "texgyrepagella-bolditalic.otf"]
"zh-TW" = ["NotoSerifTC-Regular.otf", "NotoSerifTC-Bold.otf"]
"zh-CN" = ["NotoSerifSC-Regular.ttf", "NotoSerifSC-Bold.ttf"]
