# principle-viz manual: everything the shared template needs to know about
# this manual. main.typ reads it with toml() and passes it to manual(); a YAML
# file with the same keys works too (read it with yaml()).

# Editions this manual is written in; each has chapters/<edition>/.
editions = ["en", "zh-TW", "zh-CN"]

# The documented package: shown on the title page and in the text via
# #pkg-meta("version"), #pkg-meta("python"), ...
[package]
name = "principle-viz"
version = "0.10.1"
date = "2026-10-03"
python = "3.10"
repo = "https://github.com/EconViz/principle-viz"
site = "https://econ-viz.org"
pypi = "https://pypi.org/project/principle-viz/"
email = "contact@econ-viz.org"
license = "MIT License"

# Title page, per edition. Every occurrence of package.name is set in the
# package face.
[title]
en = "principle-viz: Diagrams for Principles of Economics"
zh-TW = "principle-viz 套件：經濟學基本圖形"
zh-CN = "principle-viz 软件包：经济学基本图形"

# Release date of every version that #changed() or #api(added: ...) tags, so
# call sites only name the version. Newest first.
[releases]
"0.10.1" = "2026-10-03"
"0.10.0" = "2026-10-03"
"0.1.0" = "2026-04-25"

# Authors in title-page order. `name` and `affiliation` are given per
# edition. `affiliation` and `email` are optional; the corresponding author's
# note gives the project address, so readers do not write to co-authors.
[[authors]]
name = { en = "Pin Yue Sung", zh-TW = "Pin Yue Sung", zh-CN = "Pin Yue Sung" }
affiliation = { en = "Department of International Business, National Chengchi University, Taipei, Taiwan", zh-TW = "國立政治大學國際經營與貿易學系，臺北，臺灣", zh-CN = "台湾政治大学国际经营与贸易学系，台北，台湾" }
email = "contact@econ-viz.org"
corresponding = true

[[authors]]
name = { en = "Ling Tak Douglas Chung", zh-TW = "Ling Tak Douglas Chung", zh-CN = "Ling Tak Douglas Chung" }
affiliation = { en = "Department of International Business, National Chengchi University, Taipei, Taiwan", zh-TW = "國立政治大學國際經營與貿易學系，臺北，臺灣", zh-CN = "台湾政治大学国际经营与贸易学系，台北，台湾" }

# Placeholder names in ⟨...⟩ specific to this manual, translated for the CJK
# editions (generic ones come from template/config/strings.toml).
[meta-terms.zh-TW]
"demand" = "需求"
"supply" = "供給"
"scenario" = "情境"
"result" = "結果"
"layer id" = "圖層 id"
"label" = "標籤"
"frontier" = "生產可能曲線"
"individuals" = "個人曲線"
"outcome" = "市場結果"
"rate" = "比率"

[meta-terms.zh-CN]
"demand" = "需求"
"supply" = "供给"
"scenario" = "情景"
"result" = "结果"
"layer id" = "图层 id"
"label" = "标签"
"frontier" = "生产可能性曲线"
"individuals" = "个人曲线"
"outcome" = "市场结果"
"rate" = "比率"
