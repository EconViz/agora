# Figure output and sizes. Read by scripts/make_figures.py.

[output]
dir = "figures"
format = "pdf"

[size]
width = 2.4      # inches: one canvas, placed in the manual at this size
height = 1.9
grid-cell = 1.55 # inches: one cell of a grid figure
dpi = 300

[text]
size = 8         # pt: labels, marks and titles, the size of the captions
note = 7         # pt: axis notes (the axes.note role)

# CJK faces for the zh editions' text.
[fonts.cjk]
"zh-TW" = "PingFang TC"
"zh-CN" = "PingFang SC"

# The figures' words, by edition (English words are the keys).
[labels."zh-TW"]
"Span" = "跨度"
"gap" = "差距"
"pole" = "極點"
"centroid" = "形心"
"Feasible" = "可行"
"Slack" = "鬆弛"
"Upper\nvalue" = "較高\n數值"
"Lower\nvalue" = "較低\n數值"

[labels."zh-CN"]
"Span" = "跨度"
"gap" = "差距"
"pole" = "极点"
"centroid" = "形心"
"Feasible" = "可行"
"Slack" = "松弛"
"Upper\nvalue" = "较高\n数值"
"Lower\nvalue" = "较低\n数值"
