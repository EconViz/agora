# Figure output and sizes. Read by scripts/make_figures.py.

[output]
dir = "figures"
format = "pdf"

[size]
width = 2.4      # inches: one canvas, placed in the manual at this size
height = 1.9
grid-cell = 1.55 # inches: one cell of a grid figure
dpi = 300

[text]
size = 8         # pt: labels, marks and titles, the size of the captions
note = 7         # pt: axis notes (the axes.note role)

# Text in TeX Gyre Pagella, the manual's body face, and Noto Serif for the Chinese editions
# (agora/fonts); the math is set in Pagella Math.
[fonts]
math = "texgyrepagella-math.otf"
texmf_dirs = ["fonts/opentype/public/tex-gyre", "fonts/opentype/public/tex-gyre-math"]

[fonts.text]
en = ["texgyrepagella-regular.otf", "texgyrepagella-italic.otf", "texgyrepagella-bold.otf", "texgyrepagella-bolditalic.otf"]
"zh-TW" = ["NotoSerifTC-Regular.otf", "NotoSerifTC-Bold.otf"]
"zh-CN" = ["NotoSerifSC-Regular.ttf", "NotoSerifSC-Bold.ttf"]

# The figures' words, by edition (English words are the keys).
[labels."zh-TW"]
"Span" = "跨度"
"gap" = "差距"
"pole" = "極點"
"centroid" = "形心"
"Feasible" = "可行"
"Slack" = "鬆弛"
"Upper\nvalue" = "較高\n數值"
"Lower\nvalue" = "較低\n數值"

[labels."zh-CN"]
"Span" = "跨度"
"gap" = "差距"
"pole" = "极点"
"centroid" = "形心"
"Feasible" = "可行"
"Slack" = "松弛"
"Upper\nvalue" = "较高\n数值"
"Lower\nvalue" = "较低\n数值"
